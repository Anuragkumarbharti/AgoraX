<script>
        // Simple micro-interaction for attachment menu
        const attachBtn = document.getElementById('attachBtn');
        const attachmentMenu = document.getElementById('attachmentMenu');
        
        attachBtn.addEventListener('click', () => {
            attachmentMenu.classList.toggle('hidden');
            attachBtn.classList.toggle('rotate-45');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!attachBtn.contains(e.target) && !attachmentMenu.contains(e.target)) {
                attachmentMenu.classList.add('hidden');
                attachBtn.classList.remove('rotate-45');
            }
        });

        // Auto-scroll to bottom on load
        window.onload = () => {
            const scroller = document.querySelector('.message-scroll');
            scroller.scrollTop = scroller.scrollHeight;
        };
    </script>
